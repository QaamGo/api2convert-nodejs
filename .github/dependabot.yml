version: 2
updates:
  # npm dependencies. The published package ships zero runtime dependencies, so
  # everything here is the dev/CI toolchain resolved through the committed
  # package-lock.json — noisy but the only place npm advisories can land.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The vitest/vite/esbuild cluster releases together; one PR per train. Majors are
      # deliberately in scope: vitest and @vitest/coverage-v8 are peer-locked, so splitting
      # their majors into separate PRs makes both unmergeable (npm ci fails on ERESOLVE).
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
      lint-tooling:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'

  # GitHub Actions used by CI and the release pipeline. Keeps the pinned action
  # versions current (and, once SHA-pinned, updates the SHA + version comment).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
