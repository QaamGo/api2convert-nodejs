name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing: this job's OIDC identity is the login and signs the provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: 24
          # A release build must not restore dependencies from a shared cache.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Assert package version matches the tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) != tag ($TAG_VERSION)" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      # No token: the package's trusted publisher on npmjs.com names this repository and this file,
      # so renaming this workflow stops publishing until that setting is changed too.
      # access:public and provenance:true come from package.json publishConfig.
      - run: npm publish
